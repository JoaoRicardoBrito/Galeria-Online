<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obras — Carlos Ventura</title>
  <meta name="description" content="Galeria completa de obras de Carlos Ventura. Filtre por técnica, coleção, ano, preço e orientação.">

  <!-- Open Graph -->
  <meta property="og:title" content="Obras — Carlos Ventura">
  <meta property="og:description" content="Galeria completa de obras de Carlos Ventura.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/quadros/adrianna-geo-1rBg5YSi00c-unsplash.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap">

  <!-- CSS -->
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/gallery.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body id="page-obras">
  <header id="site-header" class="site-header"></header>

  <main>
    <div class="gallery-page">
      <div class="gallery-page__header">
        <h1 class="gallery-page__title">Obras</h1>
        <p class="gallery-page__count" id="gallery-count" aria-live="polite"></p>
      </div>

      <section class="gallery-filters" aria-label="Filtros da galeria">
        <div class="gallery-filters__bar">
          <button
            type="button"
            class="gallery-filters__toggle"
            id="filters-toggle"
            aria-expanded="true"
            aria-controls="filters-panel"
          >
            Filtros
          </button>

          <div class="gallery-filters__sort">
            <label for="sort-order" class="filter-label">Ordenar</label>
            <select id="sort-order" name="sort-order" class="filter-control">
              <option value="recentes">Mais recentes</option>
              <option value="preco-asc">Pre&ccedil;o crescente</option>
              <option value="preco-desc">Pre&ccedil;o decrescente</option>
            </select>
          </div>
        </div>

        <form class="gallery-filters__panel" id="filters-panel" data-collapsed="false">
          <div class="filter-field">
            <label for="filter-tecnica" class="filter-label">T&eacute;cnica</label>
            <select id="filter-tecnica" name="tecnica" class="filter-control">
              <option value="">Todas</option>
            </select>
          </div>

          <fieldset class="filter-field filter-field--buttons">
            <legend class="filter-label">Tamanho</legend>
            <div class="filter-toggle-group" role="group" aria-label="Filtrar por tamanho">
              <button type="button" id="filter-size-p" class="filter-chip" data-filter-size="P" aria-pressed="false" aria-label="Filtrar obras pequenas">P</button>
              <label for="filter-size-p" class="sr-only">Filtrar obras pequenas</label>
              <button type="button" id="filter-size-m" class="filter-chip" data-filter-size="M" aria-pressed="false" aria-label="Filtrar obras médias">M</button>
              <label for="filter-size-m" class="sr-only">Filtrar obras médias</label>
              <button type="button" id="filter-size-g" class="filter-chip" data-filter-size="G" aria-pressed="false" aria-label="Filtrar obras grandes">G</button>
              <label for="filter-size-g" class="sr-only">Filtrar obras grandes</label>
            </div>
          </fieldset>

          <div class="filter-field">
            <label for="filter-colecao" class="filter-label">Cole&ccedil;&atilde;o</label>
            <select id="filter-colecao" name="colecao" class="filter-control">
              <option value="">Todas</option>
            </select>
          </div>

          <div class="filter-field">
            <label for="filter-ano" class="filter-label">Ano</label>
            <select id="filter-ano" name="ano" class="filter-control">
              <option value="">Todos</option>
            </select>
          </div>

          <fieldset class="filter-field filter-field--price">
            <legend class="filter-label">Pre&ccedil;o</legend>
            <div class="price-range">
              <label for="filter-price-min">M&iacute;nimo</label>
              <input type="range" id="filter-price-min" name="preco-min" min="0" max="0" step="100">
              <output id="filter-price-min-value" for="filter-price-min">R$ 0</output>
            </div>
            <div class="price-range">
              <label for="filter-price-max">M&aacute;ximo</label>
              <input type="range" id="filter-price-max" name="preco-max" min="0" max="0" step="100">
              <output id="filter-price-max-value" for="filter-price-max">R$ 0</output>
            </div>
          </fieldset>

          <fieldset class="filter-field filter-field--buttons">
            <legend class="filter-label">Orienta&ccedil;&atilde;o</legend>
            <div class="filter-toggle-group" role="group" aria-label="Filtrar por orienta&ccedil;&atilde;o">
              <button type="button" id="filter-orientation-vertical" class="filter-chip" data-filter-orientation="vertical" aria-pressed="false" aria-label="Filtrar obras verticais">Vertical</button>
              <label for="filter-orientation-vertical" class="sr-only">Filtrar obras verticais</label>
              <button type="button" id="filter-orientation-horizontal" class="filter-chip" data-filter-orientation="horizontal" aria-pressed="false" aria-label="Filtrar obras horizontais">Horizontal</button>
              <label for="filter-orientation-horizontal" class="sr-only">Filtrar obras horizontais</label>
            </div>
          </fieldset>

          <button type="button" class="btn btn--ghost gallery-filters__clear" id="clear-filters" hidden>
            Limpar filtros
          </button>
        </form>
      </section>

      <div id="gallery-grid" class="gallery-grid"></div>

      <div id="gallery-empty" class="gallery-empty" hidden>
        <h2 class="gallery-empty__title">Nenhuma obra encontrada</h2>
        <p class="gallery-empty__text">Tente outros filtros ou explore o portfólio completo.</p>
        <a href="/obras.html" class="btn btn--ghost">Ver todas as obras</a>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script type="module" src="/js/app.js" defer></script>
</body>
</html>
